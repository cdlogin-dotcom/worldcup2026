      // ─── FIXED SYNC FUNCTION ─────────────────────────────────────────────────────────────────
      // Uses ESPN's public FIFA World Cup scoreboard endpoint. No key required.
      const syncOfficialMatchResults = async () => {
        setSyncing(true);
        setSyncStatus('Searching ESPN scores...');

        const normalizeKey = (value) => String(value || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toUpperCase()
          .replace(/&/g, ' AND ')
          .replace(/[^A-Z0-9]+/g, ' ')
          .trim();

        const teamAliases = Object.keys(GROUPS)
          .flatMap(g => GROUPS[g])
          .reduce((acc, team) => {
            acc[normalizeKey(team.id)] = team.id;
            acc[normalizeKey(team.name)] = team.id;
            return acc;
          }, {
            'CAPE VERDE': 'CPV',
            'CZECH REPUBLIC': 'CZE',
            'DEMOCRATIC REPUBLIC OF CONGO': 'COD',
            'CONGO DR': 'COD',
            'DRC': 'COD',
            'IVORY COAST': 'CIV',
            'TURKEY': 'TUR'
          });

        const espnTeamId = (competitor) => {
          const team = competitor?.team || {};
          const keys = [
            team.abbreviation,
            team.displayName,
            team.shortDisplayName,
            team.name,
            team.location
          ].map(normalizeKey).filter(Boolean);
          for (const key of keys) {
            if (teamAliases[key]) return teamAliases[key];
          }
          return keys[0] || '';
        };

        const toEspnDate = (isoDate) => isoDate.replace(/-/g, '');

        try {
          const today = new Date();
          const todayIso = [
            today.getFullYear(),
            String(today.getMonth() + 1).padStart(2, '0'),
            String(today.getDate()).padStart(2, '0')
          ].join('-');

          const groupStageSchedule = MASTER_SCHEDULE.slice(0, 72);
          const datesToFetch = [...new Set(
            groupStageSchedule
              .map(m => m.date)
              .filter(date => date <= todayIso)
          )];

          let results = [];

          if (datesToFetch.length > 0) {
            const scoreboards = await Promise.all(datesToFetch.map(async (date) => {
              const url = `https://site.api.espn.com/apis/site/v2/sports/soccer/fifa.world/scoreboard?dates=${toEspnDate(date)}&limit=200`;
              const response = await fetch(url);
              if (!response.ok) throw new Error(`ESPN API error ${response.status}`);
              return { date, data: await response.json() };
            }));

            const resultsByMatchNo = new Map();

            scoreboards.forEach(({ date, data }) => {
              (data.events || []).forEach(event => {
                const competition = event.competitions?.[0];
                const statusType = competition?.status?.type || event.status?.type || {};
                if (!competition || !statusType.completed) return;

                const competitors = competition.competitors || [];
                const espnHome = competitors.find(c => c.homeAway === 'home') || competitors[0];
                const espnAway = competitors.find(c => c.homeAway === 'away') || competitors[1];
                if (!espnHome || !espnAway) return;

                const espnHomeId = espnTeamId(espnHome);
                const espnAwayId = espnTeamId(espnAway);
                const espnHomeGoals = Number.parseInt(espnHome.score, 10);
                const espnAwayGoals = Number.parseInt(espnAway.score, 10);
                if (!espnHomeId || !espnAwayId || Number.isNaN(espnHomeGoals) || Number.isNaN(espnAwayGoals)) return;

                const eventIsoDate = event.date ? event.date.slice(0, 10) : date;
                const candidateDates = new Set([date, eventIsoDate]);
                const scheduled = groupStageSchedule.find(m => {
                  const sameDate = candidateDates.has(m.date);
                  const sameOrder = m.home === espnHomeId && m.away === espnAwayId;
                  const reversedOrder = m.home === espnAwayId && m.away === espnHomeId;
                  return sameDate && (sameOrder || reversedOrder);
                });

                if (!scheduled) return;

                const scoreInAppOrder = scheduled.home === espnHomeId
                  ? { homeGoals: espnHomeGoals, awayGoals: espnAwayGoals }
                  : { homeGoals: espnAwayGoals, awayGoals: espnHomeGoals };

                resultsByMatchNo.set(scheduled.matchNo, {
                  matchNo: scheduled.matchNo,
                  ...scoreInAppOrder,
                  completed: true
                });
              });
            });

            results = [...resultsByMatchNo.values()];
          }

          if (results.length === 0) {
            triggerToast("Scores checked \u2014 no completed matches found yet. Check back after kick-off!");
          } else {
            setMatches(prev => prev.map(m => {
              const official = results.find(o => o.matchNo === m.matchNo);
              return official ? { ...m, ...official } : m;
            }));
            triggerToast(`\u2705 Synced ${results.length} match result${results.length > 1 ? 's' : ''}!`);
          }

          const nowStr = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' local';
          setLastSyncedTime(nowStr);
          localStorage.setItem('wc2026_last_sync_v3', nowStr);
        } catch (err) {
          console.error('Sync error:', err);
          triggerToast(`Sync failed: ${err.message || 'Unknown error'}`, true);
        } finally {
          setSyncing(false);
          setSyncStatus(null);
        }
      };
      // ─────────────────────────────────────────────────────────────────────────

      const computedBracket = useMemo(() => {
        const groupStandings = {};
        Object.keys(GROUPS).forEach(g => {
          groupStandings[g] = GROUPS[g].map(t => ({ ...t, pld: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }));
        });

        matches.filter(m => m.matchNo <= 72).forEach(m => {
          if (m.completed && m.homeGoals !== null && m.awayGoals !== null) {
            const grp = groupStandings[m.group];
            if (!grp) return;
            const home = grp.find(t => t.id === m.home);
            const away = grp.find(t => t.id === m.away);
            if (home && away) {
              home.pld++; away.pld++;
              home.gf += m.homeGoals; home.ga += m.awayGoals;
              away.gf += m.awayGoals; away.ga += m.homeGoals;
              home.gd = home.gf - home.ga; away.gd = away.gf - away.ga;
              if (m.homeGoals > m.awayGoals) { home.w++; home.pts += 3; away.l++; }
              else if (m.homeGoals < m.awayGoals) { away.w++; away.pts += 3; home.l++; }
              else { home.d++; away.d++; home.pts++; away.pts++; }
            }
          }
        });

        Object.keys(groupStandings).forEach(g => {
          groupStandings[g].sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name));
        });

        const thirdPlaceTeams = Object.keys(groupStandings)
          .map(g => groupStandings[g][2] ? { ...groupStandings[g][2], group: g } : null)
          .filter(Boolean)
          .sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf || a.name.localeCompare(b.name));

        const bestThird = thirdPlaceTeams.slice(0, 8);

        const getMatchOutcome = (matchObj, status) => {
          if (!matchObj || !matchObj.completed) return null;
          const hG = matchObj.homeGoals ?? 0;
          const aG = matchObj.awayGoals ?? 0;
          if (matchObj.stats?.winner) {
            return status === 'winner' ? matchObj.stats.winner : (matchObj.stats.winner === matchObj.home ? matchObj.away : matchObj.home);
          }
          if (hG > aG) return status === 'winner' ? matchObj.home : matchObj.away;
          if (aG > hG) return status === 'winner' ? matchObj.away : matchObj.home;
          return status === 'winner' ? matchObj.home : matchObj.away;
        };

        const resolvedList = [];
        const rawList = JSON.parse(JSON.stringify(matches));
        rawList.forEach(m => {
          if (m.matchNo <= 72) { resolvedList.push(m); return; }
          const resolve = (ph) => {
            if (!ph) return null;
            if (ph.startsWith('W') || ph.startsWith('L')) {
              const depNo = parseInt(ph.substring(1));
              return getMatchOutcome(resolvedList.find(r => r.matchNo === depNo), ph.startsWith('W') ? 'winner' : 'loser');
            }
            if (ph.startsWith('1') || ph.startsWith('2')) return groupStandings[ph.substring(1)]?.[ph.startsWith('1') ? 0 : 1]?.id || null;
            if (ph.startsWith('T')) return bestThird[parseInt(ph.substring(1)) - 1]?.id || null;
            return null;
          };
          const homeId = resolve(m.placeholderHome);
          const awayId = resolve(m.placeholderAway);
          m.home = homeId || m.placeholderHome;
          m.away = awayId || m.placeholderAway;
          m.isPlaceholder = !homeId || !awayId;
          resolvedList.push(m);
        });

        return { resolvedList, groupStandings };
      }, [matches]);

                    <span className="text-slate-400 block text-xs uppercase font-mono font-bold mb-1">Key Players</span>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      {selectedTeamDetails.players.map((p, i) => <div key={i} className="bg-slate-900/60 p-2.5 rounded border border-slate-800 text-xs font-bold">⭐ {p}</div>)}
                    </div>
                  </div>
                  <div className="border-t border-slate-800 pt-3">
                    <span className="text-slate-400 block text-xs uppercase font-mono font-bold mb-2">Facts</span>
                    {selectedTeamDetails.facts.map((f, i) => <p key={i} className="text-xs leading-relaxed text-slate-300 flex gap-2 mb-1"><span className="text-emerald-500">▪</span>{f}</p>)}
                  </div>
                </div>
              </div>
            </div>
          )}

          {selectedMatchNo && selectedMatch && (() => {
            const homePH = !MAP_3_TO_2[selectedMatch.home];
            const awayPH = !MAP_3_TO_2[selectedMatch.away];
            return (
              <div className="fixed inset-0 z-[100] flex items-end justify-center sm:items-center bg-black/85 backdrop-blur-md p-4">
                <div className="bg-slate-950 border border-slate-800 w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                  <div className="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                    <span className="text-xs font-bold text-slate-400 font-mono">MATCH #{selectedMatch.matchNo}</span>
                    <button onClick={() => setSelectedMatchNo(null)} className="bg-slate-900 text-slate-400 p-2 rounded-full border border-slate-800">✕</button>
                  </div>
                  <div className="text-center py-2 border-b border-slate-900 pb-4">
                    <span className="text-xs font-bold text-emerald-400 uppercase tracking-widest font-mono">{selectedMatch.stage}</span>
                    <div className="flex justify-between items-center mt-4">
                      <div className="flex flex-col items-center w-28">
                        {getTeamFlag(selectedMatch.home, "w-14 h-9 object-cover rounded border shadow mb-2")}
                        <strong className="text-base text-white truncate max-w-[110px]">{homePH ? getPlaceholderLabel(selectedMatch.home) : selectedMatch.home}</strong>
                      </div>
                      <div className="flex-1 text-center">
                        <div className="text-sm font-semibold text-slate-300 font-mono mb-1">{selectedMatch.date}</div>
                        <div className="text-xl font-black text-emerald-400 font-mono">
                          {selectedMatch.completed ? `${selectedMatch.homeGoals} – ${selectedMatch.awayGoals}` : selectedMatch.time}
                        </div>
                        {selectedMatch.completed && <div className="text-xs text-emerald-500 mt-1 font-bold">FINAL</div>}
                      </div>
                      <div className="flex flex-col items-center w-28">
                        {getTeamFlag(selectedMatch.away, "w-14 h-9 object-cover rounded border shadow mb-2")}
                        <strong className="text-base text-white truncate max-w-[110px]">{awayPH ? getPlaceholderLabel(selectedMatch.away) : selectedMatch.away}</strong>
                      </div>
                    </div>
                  </div>
                  {!homePH && !awayPH && (
                    <div className="my-5 bg-slate-900/40 p-4 rounded-xl border border-slate-800/60 space-y-3">
                      <h4 className="text-xs font-bold text-slate-400 uppercase tracking-widest border-b border-slate-800 pb-1.5 text-center font-display">Players to Watch</h4>
                      <div className="grid grid-cols-2 gap-4 text-xs">
                        <div className="border-r border-slate-800/80 pr-2">
                          <span className="text-emerald-400 block font-bold mb-1 uppercase font-mono text-[11px]">{selectedMatch.home}</span>
                          <ul className="space-y-1 text-slate-300 font-medium">
                            {findTeam(selectedMatch.home).stars.map((s, i) => <li key={i}>⭐ {s}</li>)}
                          </ul>
                        </div>
                        <div className="pl-2">
                          <span className="text-emerald-400 block font-bold mb-1 uppercase font-mono text-[11px]">{selectedMatch.away}</span>
                          <ul className="space-y-1 text-slate-300 font-medium">
                            {findTeam(selectedMatch.away).stars.map((s, i) => <li key={i}>⭐ {s}</li>)}
                          </ul>
                        </div>
                      </div>
                    </div>
                  )}
                  <div className="mt-4 space-y-3 text-xs text-slate-400 font-mono">
                    <div className="flex justify-between"><span>STADIUM:</span><strong className="text-slate-200">{VENUES.find(v => v.id === selectedMatch.venue)?.name}</strong></div>
                    <div className="flex justify-between"><span>CITY:</span><strong className="text-slate-200">{VENUES.find(v => v.id === selectedMatch.venue)?.city}</strong></div>
                  </div>
                  <button onClick={() => setSelectedMatchNo(null)} className="w-full mt-6 bg-slate-900 hover:bg-slate-800 border border-slate-800 text-white font-bold py-3.5 px-4 rounded-xl text-sm transition">
                    Close
                  </button>
                </div>
              </div>
            );
          })()}

          <nav className="fixed bottom-0 left-0 right-0 md:bottom-6 md:left-1/2 md:-translate-x-1/2 w-full md:max-w-3xl md:rounded-2xl bg-slate-950/95 backdrop-blur-md border-t md:border border-slate-800 py-5 sm:py-6 px-6 flex justify-between items-center z-50 shadow-2xl">
            {['matches', 'roadmap', 'standings', 'teams'].map(t => (
              <button key={t} onClick={() => { setActiveTab(t); setSearchQuery(''); }} className={`flex flex-col items-center gap-1 transition py-3 flex-1 capitalize ${activeTab === t ? 'text-emerald-400 font-bold scale-105' : 'text-slate-500'}`}>
                <span className="text-xs sm:text-sm font-semibold">{t === 'standings' ? 'Groups' : t}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
