            <div class="max-w-7xl mx-auto w-full px-6 sm:px-8 py-8 sm:py-10 relative z-10 flex flex-col md:flex-row md:items-center md:justify-between gap-8">
              <div>
                <h1 class="text-4xl sm:text-5xl font-black font-display tracking-tight text-white">World Cup 2026</h1>
                <p class="text-sm sm:text-base text-slate-300 mt-2.5 max-w-lg">Match statistics synced from Google Search</p>
              </div>

              <div class="bg-slate-950/90 backdrop-blur-md rounded-2xl p-5 border border-white/10 w-full md:max-w-md shadow-lg">
                <div class="flex items-center justify-between text-xs text-slate-400 mb-3">
                  <span class="font-semibold flex items-center gap-2 tracking-wide uppercase">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 pulse-green"></span>
                    Automatic Score Feed
                  </span>
                  <span class="text-xs text-slate-500">Last Synced: <strong>{lastSyncedTime}</strong></span>
                </div>
                <button
                  onClick={syncOfficialMatchResults}
                  disabled={syncing}
                  class="w-full bg-emerald-500 hover:bg-emerald-400 disabled:bg-slate-800 disabled:text-slate-500 text-slate-950 font-extrabold py-3.5 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-md"
                >
                  {syncing ? 'Retrieving scores...' : '🔄 Sync Results'}
                </button>
                {syncError && <p class="text-xs text-red-400 mt-2.5 text-center font-medium">{syncError}</p>}
              </div>
            </div>
          </header>

          <main class="flex-1 px-6 sm:px-8 mt-8">
            {activeTab === 'matches' && (
              <div class="space-y-6">
                <div class="space-y-5 bg-slate-900/40 p-5 rounded-2xl border border-slate-800/80">
                  <div class="relative flex items-center">
                    <div class="absolute left-4 pointer-events-none text-slate-500 flex items-center">
                      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                      </svg>
                    </div>
                    <input 
                      type="text" 
                      placeholder="Search matches, host cities, or stadium names..."
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      class="w-full bg-slate-950 text-slate-100 placeholder-slate-500 text-sm py-4 pl-12 pr-4 rounded-xl border border-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 transition"
                    />
                  </div>

                  <div class="flex flex-col gap-2 border-b border-slate-800/60 pb-4 w-full">
                    <span class="text-xs font-extrabold text-slate-400 uppercase tracking-wider font-mono">Filter by Host Nation:</span>
                    <div class="flex gap-2 overflow-x-auto pb-1 text-sm scroll-smooth">
                      {['all', 'usa', 'canada', 'mexico'].map(h => (
                        <button 
                          key={h}
                          onClick={() => setHostFilter(h)}
                          class={`px-4 py-2 rounded-full font-semibold shrink-0 transition ${hostFilter === h ? 'bg-slate-200 text-slate-950' : 'bg-slate-950 text-slate-400 border border-slate-800 hover:bg-slate-900'}`}
                        >
                          {h === 'all' ? 'All Hosts' : h.toUpperCase()}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div class="flex flex-col gap-3 w-full">
                    <span class="text-xs font-extrabold text-slate-400 uppercase tracking-wider font-mono">Refine Stages & Group Standings:</span>
                    <div class="flex flex-wrap items-center gap-4 text-sm justify-between sm:justify-start">
                      <select value={selectedStageFilter} onChange={(e) => setSelectedStageFilter(e.target.value)} class="bg-slate-950 text-slate-200 py-2 px-3 rounded-lg border border-slate-800 text-sm outline-none">
                        <option value="all">All Stages</option>
                        <option value="group">Group Stage Only</option>
                        <option value="knockouts">Knockouts Only</option>
                      </select>
                      <select value={selectedGroup} onChange={(e) => { setSelectedGroup(e.target.value); setSelectedTeamFilter('all'); }} disabled={selectedStageFilter === 'knockouts'} class="bg-slate-950 text-slate-200 py-2 px-3 rounded-lg border border-slate-800 text-sm outline-none disabled:opacity-40">
                        <option value="all">All Groups</option>
                        {Object.keys(GROUPS).map(g => <option key={g} value={g}>Group {g}</option>)}
                      </select>
                      <select value={selectedTeamFilter} onChange={(e) => { setSelectedTeamFilter(e.target.value); setSelectedGroup('all'); }} class="bg-slate-950 text-slate-200 py-2 px-3 rounded-lg border border-slate-800 text-sm outline-none">
                        <option value="all">All Teams</option>
                        {allTeamsSorted.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                      </select>
                      <button onClick={() => setFavoriteFilter(!favoriteFilter)} class={`flex items-center gap-2 px-4 py-2 rounded-lg border text-xs sm:text-sm font-semibold transition ${favoriteFilter ? 'bg-amber-500/20 border-amber-500/50 text-amber-300' : 'bg-slate-950 border-slate-800 text-slate-400 hover:bg-slate-900'}`}>
                        <span>⭐ Starred Only</span>
                      </button>
                    </div>
                  </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-16">
                  {filteredMatches.map((m) => {
                    const isHomeFav = favorites.includes(m.home);
                    const isAwayFav = favorites.includes(m.away);
                    const venue = VENUES.find(v => v.id === m.venue) || VENUES[0];
                    const isHomePlaceholder = !MAP_3_TO_2[m.home];
                    const isAwayPlaceholder = !MAP_3_TO_2[m.away];

                    return (
                      <div key={m.matchNo} onClick={() => setSelectedMatchNo(m.matchNo)} class={`glass-panel rounded-2xl p-5 border cursor-pointer hover:bg-slate-900/40 hover:border-slate-700 transition flex flex-col justify-between ${isHomeFav || isAwayFav ? 'border-amber-500/40' : 'border-slate-800'}`}>
                        <div>
                          <div class="flex items-center justify-between text-xs text-slate-400 mb-4 border-b border-slate-800/60 pb-3">
                            <span class="font-extrabold text-slate-300 bg-slate-950 px-2.5 py-1 rounded-md">M#{m.matchNo} • {m.stage === 'Group' ? `Group ${m.group}` : m.stage}</span>
                            <span class="truncate max-w-[150px] font-semibold text-slate-300 underline decoration-dotted">{venue.name}</span>
                          </div>

                          <div class="grid grid-cols-12 gap-2 items-center py-3">
                            <div class="col-span-5 flex flex-col justify-center min-w-0">
                              <div class="flex items-center gap-2">
                                {getTeamFlag(m.home, "w-8 h-5 sm:w-10 sm:h-6 object-cover rounded shadow border border-slate-800 shrink-0")}
                                <span class={`text-base font-black truncate font-mono tracking-wider ${isHomePlaceholder ? 'text-slate-500 text-xs italic' : 'text-white'}`}>{isHomePlaceholder ? getPlaceholderLabel(m.home) : m.home}</span>
                              </div>
                              {!isHomePlaceholder && <span class="text-xs text-slate-400 mt-1 font-semibold">Rank #{findTeam(m.home).rank}</span>}
                            </div>

                            <div class="col-span-2 flex items-center justify-center gap-1">
                              <span class="bg-slate-950 text-emerald-400 font-extrabold text-sm sm:text-base w-10 h-10 flex items-center justify-center rounded border border-slate-800 font-mono">{m.completed ? m.homeGoals : ''}</span>
                              <span class="text-slate-600 font-black">:</span>
                              <span class="bg-slate-950 text-emerald-400 font-extrabold text-sm sm:text-base w-10 h-10 flex items-center justify-center rounded border border-slate-800 font-mono">{m.completed ? m.awayGoals : ''}</span>
                            </div>

                            <div class="col-span-5 flex flex-col justify-center items-end text-right min-w-0">
                              <div class="flex items-center gap-2 justify-end">
                                <span class={`text-base font-black truncate font-mono tracking-wider ${isAwayPlaceholder ? 'text-slate-500 text-xs italic' : 'text-white'}`}>{isAwayPlaceholder ? getPlaceholderLabel(m.away) : m.away}</span>
                                {getTeamFlag(m.away, "w-8 h-5 sm:w-10 sm:h-6 object-cover rounded shadow border border-slate-800 shrink-0")}
                              </div>
                              {!isAwayPlaceholder && <span class="text-xs text-slate-400 mt-1 font-semibold">Rank #{findTeam(m.away).rank}</span>}
                            </div>
                          </div>
                        </div>

                        <div class="flex items-center justify-between mt-5 pt-4 border-t border-slate-800/40 text-xs text-slate-400 font-mono">
                          <span class="font-semibold text-slate-300">{m.date} • {m.time} EST</span>
                          <span class="text-emerald-500 font-bold">➔</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'roadmap' && (
              <div class="space-y-6 pb-16">
                <div class="flex gap-2 overflow-x-auto pb-2 text-sm justify-start md:justify-center bg-slate-900/40 p-3.5 rounded-2xl border border-slate-800/80 font-semibold">
                  {['R32', 'R16', 'QF', 'SF', 'Finals'].map(st => (
                    <button key={st} onClick={() => setSelectedRoadmapStage(st)} class={`px-5 py-2.5 rounded-xl font-bold shrink-0 transition text-sm ${selectedRoadmapStage === st ? 'bg-emerald-500 text-slate-950 shadow' : 'bg-slate-950 text-slate-400 border border-slate-800'}`}>
                      {st === 'Finals' ? 'Finals & 3rd Place' : st}
                    </button>
                  ))}
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                  {activeMatches.filter(m => selectedRoadmapStage === 'Finals' ? (m.stage === 'TP' || m.stage === 'F') : m.stage === selectedRoadmapStage).map((m) => {
                    const isHomePlaceholder = !MAP_3_TO_2[m.home];
                    const isAwayPlaceholder = !MAP_3_TO_2[m.away];
                    const venue = VENUES.find(v => v.id === m.venue) || VENUES[0];

                    return (
                      <div key={m.matchNo} onClick={() => setSelectedMatchNo(m.matchNo)} class="glass-panel rounded-2xl p-5 border border-slate-800 cursor-pointer hover:bg-slate-900/40 transition flex flex-col justify-between">
                        <div>
                          <div class="flex items-center justify-between text-xs text-slate-400 border-b border-slate-800/60 pb-3 mb-4">
                            <span class="font-extrabold text-emerald-400 bg-slate-950 px-2 py-0.5 rounded border border-slate-800">M#{m.matchNo} • {m.stage}</span>
                            <span class="truncate font-medium text-slate-300">{venue.city}</span>
                          </div>

                          <div class="space-y-4">
                            <div class="flex items-center justify-between">
                              <div class="flex items-center gap-2 min-w-0">
                                {getTeamFlag(m.home, "w-8 h-5 object-cover rounded shadow border shrink-0")}
                                <span class={`text-sm font-bold truncate ${isHomePlaceholder ? 'text-slate-500 text-xs italic' : 'text-white font-mono'}`}>{isHomePlaceholder ? getPlaceholderLabel(m.home) : m.home}</span>
                              </div>
                              <span class="font-mono font-extrabold text-sm bg-slate-950 px-2 py-1 rounded border border-slate-800 text-emerald-400">{m.completed ? m.homeGoals : ''}</span>
                            </div>
                            <div class="flex items-center justify-between">
                              <div class="flex items-center gap-2 min-w-0">
                                {getTeamFlag(m.away, "w-8 h-5 object-cover rounded shadow border shrink-0")}
                                <span class={`text-sm font-bold truncate ${isAwayPlaceholder ? 'text-slate-500 text-xs italic' : 'text-white font-mono'}`}>{isAwayPlaceholder ? getPlaceholderLabel(m.away) : m.away}</span>
                              </div>
                              <span class="font-mono font-extrabold text-sm bg-slate-950 px-2 py-1 rounded border border-slate-800 text-emerald-400">{m.completed ? m.awayGoals : ''}</span>
                            </div>
                          </div>
                        </div>
                        <div class="mt-4 pt-3 border-t border-slate-800/40 text-[10px] text-slate-500 font-mono">{m.date} • {m.time} EST</div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'standings' && (
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-16">
                {Object.keys(groupStandings).map((groupKey) => (
                  <div key={groupKey} class="glass-panel rounded-2xl p-5 shadow-xl">
                    <h4 class="font-bold text-sm text-white flex items-center gap-2 mb-4 uppercase"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>Group {groupKey}</h4>
                    <table class="w-full text-left text-xs sm:text-sm">
                      <thead>
                        <tr class="text-slate-500 border-b border-slate-800 uppercase text-[11px]"><th class="py-2">Team</th><th class="py-2 text-center">Pld</th><th class="py-2 text-center">GD</th><th class="py-2 text-center font-bold text-white">Pts</th></tr>
                      </thead>
                      <tbody>
                        {groupStandings[groupKey].map((team, idx) => (
                          <tr key={team.id} class="border-b border-slate-800/30">
                            <td class="py-3 flex items-center gap-2 truncate max-w-[150px]"><span class="text-slate-500 font-black w-4">{idx + 1}</span>{getTeamFlag(team.id, "w-6 h-4 object-cover rounded border shrink-0")}<span class="truncate">{team.name}</span></td>
                            <td class="py-3 text-center text-slate-300 font-mono">{team.pld}</td>
                            <td class="py-3 text-center text-slate-300 font-mono">{team.gd > 0 ? `+${team.gd}` : team.gd}</td>
                            <td class="py-3 text-center font-bold text-white font-mono">{team.pts}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                ))}
              </div>
            )}

            {activeTab === 'teams' && (
              <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-5 pb-16">
                {allTeamsSorted.map((team) => {
                  const isFav = favorites.includes(team.id);
                  return (
                    <div key={team.id} onClick={() => setSelectedTeamIdForModal(team.id)} class={`glass-panel p-5 rounded-2xl transition flex flex-col justify-between cursor-pointer hover:border-emerald-500/50 shadow-md ${isFav ? 'border-amber-500/40' : 'border-slate-800'}`}>
                      <div class="flex justify-between items-start">
                        <span class="text-xs font-bold text-slate-400 font-mono">Code: {team.id}</span>
                        <button onClick={(e) => { e.stopPropagation(); toggleFavorite(team.id); }} class="text-sm p-1 hover:bg-slate-800 rounded">{isFav ? '⭐' : '☆'}</button>
                      </div>
                      <div class="mt-5">
                        {getTeamFlag(team.id, "w-10 h-7 object-cover rounded shadow border mb-2")}
                        <h4 class="text-sm font-black text-white truncate">{team.name}</h4>
                        <span class="text-xs text-slate-500 block font-mono">Rank: #{team.rank}</span>
                      </div>
                    </div>
                  );
                })}
              </div>
            )}
          </main>

          {/* TEAM PROFILE MODAL */}
          {selectedTeamIdForModal && selectedTeamDetails && (
            <div class="fixed inset-0 z-[100] flex items-end justify-center sm:items-center bg-black/85 backdrop-blur-md p-4">
              <div class="bg-slate-950 border border-slate-800 w-full max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl relative max-h-[85vh] overflow-y-auto">
                <div class="flex justify-between items-start border-b border-slate-800 pb-4 mb-4">
                  <div class="flex gap-3 items-center">
                    {getTeamFlag(selectedTeamIdForModal, "w-14 h-9 object-cover rounded border shadow")}
                    <div>
                      <h3 class="text-xl font-black text-white">{findTeam(selectedTeamIdForModal).name}</h3>
                      <p class="text-xs text-emerald-400 font-mono font-semibold">FIFA Rank: #{findTeam(selectedTeamIdForModal).rank}</p>
                    </div>
                  </div>
                  <button onClick={() => setSelectedTeamIdForModal(null)} class="bg-slate-900 text-slate-400 p-2 rounded-full border border-slate-800">✕</button>
                </div>
                <div class="space-y-4 text-sm sm:text-base">
                  <p><span class="text-slate-400 block text-xs uppercase font-mono font-bold">Head Coach</span><strong class="text-emerald-400 text-base">{selectedTeamDetails.coach}</strong></p>
                  <div>
                    <span class="text-slate-400 block text-xs uppercase font-mono font-bold mb-1">Squad Key Stars</span>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">{selectedTeamDetails.players.map((p, i) => <div key={i} class="bg-slate-900/60 p-2.5 rounded border border-slate-800 text-xs sm:text-sm font-bold">⭐ {p}</div>)}</div>
                  </div>
                  <div class="border-t border-slate-800 pt-3">
                    <span class="text-slate-400 block text-xs uppercase font-mono font-bold mb-2">Audited Trivia & Insights</span>
                    {selectedTeamDetails.facts.map((f, i) => <p key={i} class="text-xs sm:text-sm leading-relaxed text-slate-300 flex gap-2"><span class="text-emerald-500">▪</span>{f}</p>)}
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MATCH DETAILS CENTER MODAL */}
          {selectedMatchNo && selectedMatch && (() => {
            const modalHomePlaceholder = !MAP_3_TO_2[selectedMatch.home];
            const modalAwayPlaceholder = !MAP_3_TO_2[selectedMatch.away];

            return (
              <div class="fixed inset-0 z-[100] flex items-end justify-center sm:items-center bg-black/85 backdrop-blur-md p-4">
                <div class="bg-slate-950 border border-slate-800 w-full max-w-md sm:max-w-lg rounded-t-3xl sm:rounded-3xl p-6 shadow-2xl relative max-h-[85vh] overflow-y-auto">
                  <div class="flex justify-between items-center border-b border-slate-800 pb-4 mb-4">
                    <span class="text-xs font-bold text-slate-400 font-mono">MATCH CENTER • No. {selectedMatch.matchNo}</span>
                    <button onClick={() => setSelectedMatchNo(null)} class="bg-slate-900 text-slate-400 p-2 rounded-full border border-slate-800">✕</button>
                  </div>
                  <div class="text-center py-2 border-b border-slate-900 pb-4">
                    <span class="text-xs font-bold text-emerald-400 uppercase tracking-widest font-mono">{selectedMatch.stage}</span>
                    <div class="flex justify-between items-center mt-4">
                      <div class="flex flex-col items-center w-28">
                        {getTeamFlag(selectedMatch.home, "w-14 h-9 object-cover rounded border shadow mb-2")}
                        <strong class="text-base text-white truncate max-w-[110px]">{modalHomePlaceholder ? getPlaceholderLabel(selectedMatch.home) : selectedMatch.home}</strong>
                      </div>
                      <div class="flex-1 text-center">
                        <div class="text-sm font-semibold text-slate-400 font-mono mb-0.5">{selectedMatch.date}</div>
                        <div class="text-xl font-black text-emerald-400 font-mono">{selectedMatch.completed ? `${selectedMatch.homeGoals} - ${selectedMatch.awayGoals}` : `${selectedMatch.time} EST`}</div>
                      </div>
                      <div class="flex flex-col items-center w-28">
                        {getTeamFlag(selectedMatch.away, "w-14 h-9 object-cover rounded border shadow mb-2")}
                        <strong class="text-base text-white truncate max-w-[110px]">{modalAwayPlaceholder ? getPlaceholderLabel(selectedMatch.away) : selectedMatch.away}</strong>
                      </div>
                    </div>
                  </div>
                  <div class="mt-4 space-y-3.5 text-xs sm:text-sm text-slate-400 font-mono">
                    <div class="flex justify-between"><span>STADIUM:</span><strong class="text-slate-200">{VENUES.find(v => v.id === selectedMatch.venue)?.name}</strong></div>
                    <div class="flex justify-between"><span>LOCATION:</span><strong class="text-slate-200">{VENUES.find(v => v.id === selectedMatch.venue)?.city}</strong></div>
                  </div>
                </div>
              </div>
            );
          })()}

          <nav class="fixed bottom-0 left-0 right-0 md:bottom-6 md:left-1/2 md:-translate-x-1/2 w-full md:max-w-3xl md:rounded-2xl bg-slate-950/95 backdrop-blur-md border-t md:border border-slate-800 py-5 sm:py-6 px-6 flex justify-between items-center z-50 shadow-2xl">
            {['matches', 'roadmap', 'standings', 'teams'].map(t => (
              <button key={t} onClick={() => { setActiveTab(t); setSearchQuery(''); }} class={`flex flex-col items-center gap-1 transition py-3 flex-1 capitalize ${activeTab === t ? 'text-emerald-400 font-bold scale-105' : 'text-slate-500'}`}>
                <span class="text-xs sm:text-sm font-semibold">{t === 'standings' ? 'Groups' : t}</span>
              </button>
            ))}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
