                                minute: { type: "INTEGER" },
                                player: { type: "STRING" },
                                team: { type: "STRING" }
                              },
                              required: ["type", "minute", "player", "team"]
                            }
                          }
                        },
                        required: ["possession", "shots", "shotsOnTarget", "fouls", "corners", "passAccuracy", "yellowCards", "redCards", "timeline"]
                      }
                    },
                    required: ["matchNo", "homeGoals", "awayGoals", "completed"]
                  }
                }
              },
              required: ["results"]
            }
          }
        };

        let attempt = 0;
        const delays = [1000, 2000, 4000, 8000, 16000];

        const runFetchWithBackoff = async () => {
          try {
            const response = await fetch(url, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              throw new Error(`Server returned HTTP ${response.status}`);
            }

            const data = await response.json();
            const textResponse = data.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!textResponse) {
              throw new Error("Empty model response received");
            }

            const parsed = JSON.parse(textResponse);
            return parsed.results || [];
          } catch (err) {
            if (attempt < 5) {
              const currentDelay = delays[attempt];
              attempt++;
              await new Promise(res => setTimeout(res, currentDelay));
              return runFetchWithBackoff();
            } else {
              throw err;
            }
          }
        };

        try {
          const results = await runFetchWithBackoff();
          if (results.length === 0) {
            triggerToast("Sync completed. Real scores will automatically import beginning June 11, 2026.");
          } else {
            const updated = matches.map(m => {
              const official = results.find(o => o.matchNo === m.matchNo);
              if (official) {
                return { ...m, ...official };
              }
              return m;
            });
            setMatches(updated);
            triggerToast(`Synced ${results.length} official match results successfully!`);
          }

          const nowStr = new Date().toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) + ' ET';
          setLastSyncedTime(nowStr);
          localStorage.setItem('wc2026_last_sync_v4', nowStr);
        } catch (err) {
          setSyncError("Network error: Could not sync live feed. Please try again.");
          triggerToast("Sync connection failed.", true);
        } finally {

      // Compile alphabetical list of all 48 teams
      const allTeamsSorted = useMemo(() => {

        Object.keys(GROUPS).forEach(g => {
          GROUPS[g].forEach(t => {

        return teamsList.sort((a, b) => a.name.localeCompare(b.name));

      // Dynamic Standings calculation based on Synced API outcomes

        const std = {};
        Object.keys(GROUPS).forEach(g => {
          std[g] = GROUPS[g].map(t => ({
            ...t,
            pld: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0
          }));
        });

        matches.forEach(m => {
          if (m.completed && m.homeGoals !== null && m.awayGoals !== null) {
            const grp = std[m.group];
            if (!grp) return;
            const home = grp.find(t => t.id === m.home);
            const away = grp.find(t => t.id === m.away);
            if (home && away) {
              home.pld += 1;
              away.pld += 1;
              home.gf += m.homeGoals;
              home.ga += m.awayGoals;
              away.gf += m.awayGoals;
              away.ga += m.homeGoals;
              home.gd = home.gf - home.ga;
              away.gd = away.gf - away.ga;

              if (m.homeGoals > m.awayGoals) {
                home.w += 1;
                home.pts += 3;
                away.l += 1;
              } else if (m.homeGoals < m.awayGoals) {
                away.w += 1;
                away.pts += 3;
                home.l += 1;
              } else {
                home.d += 1;
                away.d += 1;
                home.pts += 1;
                away.pts += 1;
              }
            }

            if (b.gd !== a.gd) return b.gd - a.gd;
            if (b.gf !== a.gf) return b.gf - a.gf;
